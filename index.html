<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎁 Bạn có một món quà</title>

<meta property="og:title" content="🎁 Bạn có một món quà đặc biệt!">
<meta property="og:description" content="Nhấn vào đây để mở món quà bí mật...">
<meta property="og:image" content="https://placehold.co/1200x630/ff5c8a/ffffff?text=🎁+MO+QUA">
<meta property="og:type" content="website">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 20% 20%,#ffffff55 0 2px,transparent 3px),
        radial-gradient(circle at 80% 30%,#ffffff44 0 2px,transparent 3px),
        linear-gradient(135deg,#ff4f81,#ff8a65);
    color:white;
}

.container{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.screen{
    width:100%;
    max-width:430px;
    text-align:center;
}

h1{
    font-size:30px;
    margin:0 0 10px;
}

.subtitle{
    font-size:16px;
    opacity:.9;
    margin-bottom:45px;
}

/* =========================
   HỘP QUÀ
========================= */

.gift-wrap{
    position:relative;
    width:230px;
    height:230px;
    margin:auto;
    cursor:pointer;
    user-select:none;
}

.gift{
    position:absolute;
    left:35px;
    top:95px;
    width:160px;
    height:115px;
    background:#e91e63;
    border-radius:8px;
    box-shadow:0 18px 35px #0005;
}

.gift:after{
    content:"";
    position:absolute;
    left:67px;
    top:0;
    width:26px;
    height:115px;
    background:#ffd740;
}

.lid{
    position:absolute;
    z-index:5;
    left:25px;
    top:75px;
    width:180px;
    height:42px;
    background:#f06292;
    border-radius:8px;
    box-shadow:0 10px 20px #0004;
    transition:.7s cubic-bezier(.2,.8,.2,1);
}

.lid:after{
    content:"";
    position:absolute;
    left:77px;
    top:0;
    width:26px;
    height:42px;
    background:#ffd740;
}

.bow{
    position:absolute;
    z-index:8;
    left:82px;
    top:43px;
    width:65px;
    height:40px;
}

.bow:before,
.bow:after{
    content:"";
    position:absolute;
    width:45px;
    height:30px;
    background:#ffd740;
    border-radius:50% 50% 50% 10%;
}

.bow:before{
    left:-12px;
    transform:rotate(25deg);
}

.bow:after{
    right:-12px;
    transform:scaleX(-1) rotate(25deg);
}

.ribbon{
    position:absolute;
    z-index:3;
    left:67px;
    top:0;
    width:26px;
    height:115px;
    background:#ffd740;
}

.click{
    margin-top:15px;
    font-weight:bold;
    animation:pulse 1.3s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
    }
}

/* =========================
   KHI MỞ
========================= */

.open .lid{
    transform:
        translateY(-110px)
        rotate(-12deg);
    opacity:0;
}

.open .bow{
    transform:
        translateY(-100px)
        rotate(-15deg);
    opacity:0;
    transition:.6s;
}

/* =========================
   KẾT QUẢ
========================= */

.result{
    display:none;
    animation:appear .8s ease;
}

.result.show{
    display:block;
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.big{
    font-size:70px;
}

.result h2{
    font-size:34px;
    margin:5px 0;
}

.result p{
    font-size:17px;
    line-height:1.5;
}

.product{
    background:white;
    color:#222;
    border-radius:22px;
    padding:20px;
    margin-top:20px;
    box-shadow:0 20px 50px #0005;
}

.product img{
    width:100%;
    height:220px;
    object-fit:contain;
    border-radius:15px;
}

.product-name{
    font-size:22px;
    font-weight:bold;
    margin-top:15px;
}

.price{
    color:#e91e63;
    font-size:23px;
    font-weight:bold;
    margin:8px 0;
}

.button{
    display:block;
    padding:14px;
    background:#e91e63;
    color:white;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
    margin-top:15px;
}

.note{
    margin-top:18px;
    font-size:13px;
    opacity:.75;
}

/* =========================
   CONFETTI
========================= */

.confetti{
    position:fixed;
    top:-30px;
    z-index:100;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- MÀN HÌNH 1 -->
    <div class="screen" id="giftScreen">

        <h1>🎁 BẠN CÓ MỘT MÓN QUÀ!</h1>

        <div class="subtitle">
            Có người gửi bạn một bất ngờ...
            <br>
            Nhấn vào hộp để mở nhé 👀
        </div>

        <div class="gift-wrap" id="gift">

            <div class="bow"></div>

            <div class="lid"></div>

            <div class="gift">
                <div class="ribbon"></div>
            </div>

        </div>

        <div class="click">
            👆 NHẤN ĐỂ MỞ QUÀ
        </div>

    </div>


    <!-- MÀN HÌNH 2 -->
    <div class="screen result" id="result">

        <div class="big">🎉</div>

        <h2>CHÚC MỪNG!</h2>

        <p>
            Bạn vừa nhận được một món quà đặc biệt...
        </p>

        <div class="product">

            <img
                id="productImage"
                src="https://placehold.co/600x400/png?text=YOUR+PRODUCT"
                alt="Sản phẩm"
            >

            <div
                class="product-name"
                id="productName">
                iPhone 15 Pro
            </div>

            <div
                class="price"
                id="productPrice">
                0đ
            </div>

            <p>
                🎁 Món quà cực kỳ giá trị!
                <br><br>

                <strong id="trollText">
                    Nhưng rất tiếc...
                    BẠN VỪA BỊ TROLL 😂😂😂
                </strong>
            </p>

            <a
                id="productLink"
                class="button"
                href="https://www.google.com"
                target="_blank">
                🎁 NHẬN QUÀ
            </a>

        </div>

        <div class="note">
            😈 Gửi link này cho một người khác để troll họ.
        </div>

    </div>

</div>


<script>

/* ==================================
   CHỈNH NỘI DUNG Ở ĐÂY
================================== */

const CONFIG = {

    // Tên sản phẩm
    name: "iPhone 15 Pro 🤣",

    // Giá
    price: "0đ",

    // Ảnh sản phẩm
    image:
    "https://placehold.co/600x400/png?text=iPhone+15+Pro",

    // Câu troll
    troll:
    "Nhưng rất tiếc... BẠN VỪA BỊ TROLL 😂😂😂",

    // Link khi bấm nhận quà
    link:
    "https://www.google.com"

};


/* ==================================
   ĐỔ NỘI DUNG
================================== */

document.getElementById("productName")
.innerText = CONFIG.name;

document.getElementById("productPrice")
.innerText = CONFIG.price;

document.getElementById("productImage")
.src = CONFIG.image;

document.getElementById("trollText")
.innerText = CONFIG.troll;

document.getElementById("productLink")
.href = CONFIG.link;


/* ==================================
   MỞ HỘP
================================== */

const gift = document.getElementById("gift");
const giftScreen = document.getElementById("giftScreen");
const result = document.getElementById("result");

gift.addEventListener("click",function(){

    gift.classList.add("open");

    setTimeout(function(){

        giftScreen.style.display="none";

        result.classList.add("show");

        confetti();

    },700);

});


/* ==================================
   CONFETTI
================================== */

function confetti(){

    const icons=[
        "🎉",
        "🎊",
        "✨",
        "🎁",
        "😂",
        "🤣",
        "💥",
        "❤️"
    ];

    for(let i=0;i<70;i++){

        const item=document.createElement("div");

        item.className="confetti";

        item.innerText=
            icons[
                Math.floor(
                    Math.random()*icons.length
                )
            ];

        item.style.left=
            Math.random()*100+"vw";

        item.style.fontSize=
            (15+Math.random()*20)+"px";

        item.style.animationDuration=
            (2+Math.random()*3)+"s";

        item.style.animationDelay=
            Math.random()*.5+"s";

        document.body.appendChild(item);

        setTimeout(()=>{
            item.remove();
        },5000);

    }

}

</script>

</body>
</html>
